[project]
name = "clipdrop"
version = "2.1.0"
description = "Save clipboard content (text and images) to files with smart format detection"
readme = "README.md"
authors = [
    { name = "Prateek", email = "package@prateek.mozmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["clipboard", "cli", "productivity", "macos", "file-management", "text-processing", "image-processing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Utilities",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Archiving",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Environment :: Console",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.26.7",
    "rich>=15.0.0",
    "pyperclip>=1.11.0",
    "pillow>=12.2.0",
    "reportlab>=4.5.1",
    "beautifulsoup4>=4.14.3",
    "requests>=2.34.2",
    "lxml>=6.1.1",
    "html2text>=2025.4.15",
    "markdown-it-py>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/prateekjain24/clipdrop"
Issues = "https://github.com/prateekjain24/clipdrop/issues"

[project.scripts]
clipdrop = "clipdrop.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
    "black>=26.5.1",
    "mypy>=2.1.0",
    "psutil>=7.2.2",
]
youtube = [
    "yt-dlp>=2026.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/clipdrop/bin/clipdrop-transcribe-clipboard" = "clipdrop/bin/clipdrop-transcribe-clipboard"
"src/clipdrop/bin/clipdrop-summarize" = "clipdrop/bin/clipdrop-summarize"
"src/clipdrop/bin/clipdrop-ocr" = "clipdrop/bin/clipdrop-ocr"
"src/clipdrop/bin/clipdrop-suggest-name" = "clipdrop/bin/clipdrop-suggest-name"
"src/clipdrop/bin/clipdrop-transform" = "clipdrop/bin/clipdrop-transform"

[tool.ruff.lint]
# Pin the rule set explicitly: ruff 0.16 expanded its defaults, which
# broke CI with hundreds of findings in pre-existing code. This matches
# ruff's pre-0.16 default selection.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests",
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
]
