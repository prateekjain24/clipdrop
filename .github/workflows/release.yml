name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run-version:
        description: 'Version to dry-run (e.g. 2.3.0). Builds and verifies; no release or upload.'
        required: true

jobs:
  verify:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Determine expected version
      id: ver
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ inputs.dry-run-version }}" >> "$GITHUB_OUTPUT"
        else
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
        fi

    - name: Check version consistency (tag == pyproject == __init__ == CHANGELOG)
      run: python scripts/check_versions.py "${{ steps.ver.outputs.version }}"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: pytest tests/ --tb=short

    - name: Lint
      run: ruff check src/ tests/

  publish:
    needs: verify
    runs-on: macos-14
    permissions:
      contents: write  # Required to create releases

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch twine

    - name: Verify Swift helper binary
      run: |
        echo "Verifying pre-built Swift helper for release..."

        # Check if binary exists
        if [ ! -f "src/clipdrop/bin/clipdrop-transcribe-clipboard" ]; then
          echo "❌ Swift helper binary not found!"
          exit 1
        fi

        echo "✅ Swift helper binary found"

        # Verify the universal binary
        echo "Verifying universal binary architecture..."
        lipo -info src/clipdrop/bin/clipdrop-transcribe-clipboard
        file src/clipdrop/bin/clipdrop-transcribe-clipboard

        # Ensure it's executable
        chmod +x src/clipdrop/bin/clipdrop-transcribe-clipboard

    - name: Build package
      run: |
        hatch build

    - name: Check package
      run: |
        twine check dist/*

    - name: Extract release notes from CHANGELOG
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ inputs.dry-run-version }}"
        else
          VERSION="${GITHUB_REF_NAME#v}"
        fi
        python scripts/extract_changelog.py "$VERSION" > release-notes.md
        echo "Release notes:"
        cat release-notes.md

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v3
      with:
        name: Release ${{ github.ref_name }}
        body_path: release-notes.md
        files: |
          dist/*.whl
          dist/*.tar.gz

    - name: Upload to PyPI
      if: github.event_name == 'push'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "${TWINE_PASSWORD:-}" ]; then
          echo "Missing PYPI_API_TOKEN secret. Add it in Repo → Settings → Secrets and variables → Actions." >&2
          exit 1
        fi
        python -m twine upload --non-interactive --skip-existing dist/*
